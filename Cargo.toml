[package]
name = "ncli"
version = "0.1.6"
edition = "2024"
description = "A helper CLI for managing and generating NestJS project resources."
readme = "README.md"
license = "MIT"
repository = "https://github.com/manandhar01/ncli"
categories = ["command-line-utilities", "development-tools"]
keywords = ["nestjs", "cli", "code-generation", "project-management"]
homepage = "https://github.com/manandhar01/ncli"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
colored = "3.1.1"
regex = "1.12.3"
serde_json = "1.0.149"
sha2 = "0.10.9"
walkdir = "2.5.0"
